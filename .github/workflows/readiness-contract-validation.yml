name: Validate Dashboard Readiness Contract
# PR-only, low-cost validation for mixed-status decoder behavior.

on:
  pull_request:
    branches: [main]
    paths:
      - "contract-guard.js"
      - "tests/contract-guard.test.js"
      - ".github/workflows/readiness-contract-validation.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-readiness-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check contract-guard.js
      - name: Run contract guard regression
        run: node tests/contract-guard.test.js
